<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: exposure-comp-a.jpg</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f1e9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-title region text" data-region="title"><!-- LICENSE ARCHITECT masthead in bold black caps --><p style="font-size:var(--r-title-font);font-family:var(--r-title-family),sans-serif;font-weight:var(--r-title-weight);line-height:1.05;margin:0">title</p></div>
  <div class="r-btn-import region control" data-region="btn-import"><!-- IMPORT outlined button top right: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop btn-import); a control need not have button chrome --></div>
  <div class="r-btn-export region control" data-region="btn-export"><!-- EXPORT outlined button top right: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop btn-export); a control need not have button chrome --></div>
  <div class="r-profile-strip region control" data-region="profile-strip"><!-- PROFILE and QTY ruled field strip: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop profile-strip); a control need not have button chrome --></div>
  <div class="r-req-label region text" data-region="req-label"><!-- REQUIREMENTS section label --><p style="font-size:var(--r-req-label-font);line-height:1.05;margin:0">req-label</p></div>
  <div class="r-req-list region control" data-region="req-list"><!-- two-column requirement checklist with hatch-selected checkboxes: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop req-list); a control need not have button chrome --></div>
  <div class="r-wad-swatches region control" data-region="wad-swatches"><!-- WAD pattern swatch row of hatch density samples: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop wad-swatches); a control need not have button chrome --></div>
  <div class="r-quote-table region control" data-region="quote-table"><!-- quote data table with ITEM PLAN QTY UNIT PRICE TOTAL: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop quote-table); a control need not have button chrome --></div>
  <div class="r-compare-sheet region chrome" data-region="compare-sheet"><!-- translucent Compare overlay sheet with soft shadow --></div>
  <div class="r-compare-title region text" data-region="compare-title"><!-- COMPARE heading on overlay --><p style="font-size:var(--r-compare-title-font);line-height:1.05;margin:0">compare-title</p></div>
  <div class="r-compare-cols region text" data-region="compare-cols"><!-- AS-IS and TO-BE feature lists on overlay --><p style="line-height:1.05;margin:0">compare-cols</p></div>
  <div class="r-compare-actions region control" data-region="compare-actions"><!-- filtration control and HOLD BACK pink action: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop compare-actions); a control need not have button chrome --></div>
  <div class="r-rec-label region text" data-region="rec-label"><!-- RECOMMENDATION label --><p style="line-height:1.05;margin:0">rec-label</p></div>
  <div class="r-price-plate region control" data-region="price-plate"><!-- magenta filtration price plate showing € 57.20: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop price-plate); a control need not have button chrome --></div>
  <div class="r-delta-hatch region control" data-region="delta-hatch"><!-- hatched delta box showing +€12.40: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop delta-hatch); a control need not have button chrome --></div>
</main>
</body>
</html>
